[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "workreceipt"
version = "0.6.1"
description = "Client-safe work report from Claude Code sessions + git. Local only."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
workreceipt = "workreceipt:main"
workreceipt-app = "workreceipt_app:main"

[tool.setuptools]
py-modules = ["workreceipt", "app_core", "workreceipt_app", "client_safe"]
