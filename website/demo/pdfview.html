<!doctype html><meta charset="utf-8"><title>pdf</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url("../assets/fonts/bricolage-grotesque-latin-wght-normal.woff2") format("woff2");font-weight:200 800}
*{box-sizing:border-box;margin:0}html,body{width:1440px;height:810px;overflow:hidden;font-family:"Bricolage Grotesque",system-ui,sans-serif;background:#d9d6cd}
.bar{height:48px;background:#f6f3ec;border-bottom:1px solid rgba(27,28,26,.14);display:flex;align-items:center;justify-content:center;font-size:15px;color:#5a5952;gap:10px}
.bar b{color:#1b1c1a;font-weight:550}.pill{font-size:12px;background:rgba(13,139,127,.12);color:#0a6f65;padding:3px 9px;border-radius:99px}
.wrap{height:762px;overflow:hidden;position:relative}
.page{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:620px;box-shadow:0 18px 50px -14px rgba(27,28,26,.45);background:#fff;transition:none}
.page img{display:block;width:100%}</style>
<div class="bar"><b id="fn">report.pdf</b><span class="pill">PDF, exported by WorkReceipt</span></div>
<div class="wrap"><div class="page" id="pg"></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('fn').textContent=q.get('name')||'report.pdf';
const n=+q.get('n')||1;const pg=document.getElementById('pg');for(let i=1;i<=n;i++){const im=new Image();im.src='build/pdfview/p-'+i+'.png';pg.appendChild(im)}
window.__pdfScroll=y=>{pg.style.top=(26-y)+'px'}</script>
